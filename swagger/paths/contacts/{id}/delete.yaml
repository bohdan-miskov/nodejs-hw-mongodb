tags:
  - Contacts
summary: Delete contact by id
operationId: deleteContact
description: 'Permanently deletes a contact by its unique identifier.
  The contact must belong to the authenticated user.
  This operation is irreversible and removes the contact from the database.
  Ideal for managing and cleaning up outdated or unwanted contact records.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '688ddec8932e19985a0c4dd0'
responses:
  '204':
    description: 'Delete contact by id'
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/contacts/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
