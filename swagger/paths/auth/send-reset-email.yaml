tags:
  - Auth
summary: Send reset password email
operationId: sendResetUserPasswordEmail
description:
  'Sends a password reset email to the user. Requires a valid email address in the request body.
  On success, returns a confirmation message and a 200 status code.
  Returns 404 if the email is not associated with any user.'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            description: User's email
            example: 'john@gmail.com'
responses:
  '200':
    description: Send reset password email
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
            data:
              type: object
  '400':
    $ref: '../../components/responses/400.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
